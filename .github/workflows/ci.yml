name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both platforms, because the code the tests drive is POSIX sh and awk, where
  # the two families genuinely differ: `date` cannot subtract days the same way
  # on each, and BSD and GNU awk disagree about what is an extension. The tests
  # run the real scripts, so on Ubuntu they are already running under dash.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install
        run: pnpm install
      - name: Test
        run: pnpm test

  # Parsing every script catches the branches the tests never take: an error path
  # with a bashism in it is invisible until the day it runs. dash is the smallest
  # POSIX shell and is `/bin/sh` on Debian and Ubuntu, so it rejects what bash in
  # sh-mode, which is `/bin/sh` on macOS, quietly accepts.
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse with dash
        run: |
          # Found by shebang rather than by extension, so the list cannot go
          # stale and nothing has to be remembered when a script is added. A
          # `*.sh` glob would miss bin/agent-journal, which has no extension and
          # is the one that matters most.
          scripts=$(git ls-files | while IFS= read -r file; do
            case "$(head -n 1 "$file")" in
              '#!/bin/sh'* | '#!/usr/bin/env sh'*) echo "$file" ;;
            esac
          done)

          [ -n "$scripts" ] || { echo 'found no shell scripts, so this check is doing nothing'; exit 1; }

          echo "$scripts" | while IFS= read -r file; do
            echo "parsing $file"
            dash -n "$file" || exit 1
          done

  # The manifest is only ever read by Claude Code, on someone else's machine, at
  # install time. This is the one place it meets the program that reads it, which
  # is why the CLI is unpinned: the question is whether the plugin is still valid
  # against the current one, not against the one this was written for.
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # The native installer, not npm: it ships a binary that needs no Node at
      # all, which is why this job has no toolchain step.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the plugin
        run: claude plugin validate .
