name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Both platforms, because the code the tests drive is POSIX sh and awk, where
  # the two families genuinely differ: `date` cannot subtract days the same way
  # on each, and BSD and GNU awk disagree about what is an extension. The tests
  # run the real scripts, so on Ubuntu they are already running under dash.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install
        run: pnpm install
      - name: Test
        run: pnpm test

  # Parsing every script catches the branches the tests never take: an error path
  # with a bashism in it is invisible until the day it runs. dash is the smallest
  # POSIX shell and is `/bin/sh` on Debian and Ubuntu, so it rejects what bash in
  # sh-mode, which is `/bin/sh` on macOS, quietly accepts.
  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse with dash
        run: |
          # Two ways in, so the list cannot go stale: by shebang, which is what
          # catches bin/agent-journal, since it has no extension and is the one
          # that matters most; and by `.sh`, which is what catches the fragments
          # that are sourced rather than run and so carry no shebang.
          scripts=$(git ls-files | while IFS= read -r file; do
            case $file in
              *.sh) echo "$file"; continue ;;
            esac
            case "$(head -n 1 "$file")" in
              '#!/bin/sh'* | '#!/usr/bin/env sh'*) echo "$file" ;;
            esac
          done)

          [ -n "$scripts" ] || { echo 'found no shell scripts, so this check is doing nothing'; exit 1; }

          echo "$scripts" | while IFS= read -r file; do
            echo "parsing $file"
            dash -n "$file" || exit 1
          done

  # The manifest is only ever read by Claude Code, on someone else's machine, at
  # install time. This is the one place it meets the program that reads it, which
  # is why the CLI is unpinned: the question is whether the plugin is still valid
  # against the current one, not against the one this was written for.
  plugin:
    name: Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      # The native installer, not npm: it ships a binary that needs no Node at
      # all, which is why this job has no toolchain step.
      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Validate the plugin
        run: claude plugin validate .
      # The journal pane's tests run in Claude Code's own kit, the environment
      # its hooks run in, not under vitest: every *.test.ts under the plugin.
      - name: Test the journal pane
        run: claude plugin test .

  # Claude Code takes an update only when the version in the manifest changes,
  # however many commits are pushed after it. So a change to what the plugin
  # ships, made after the last version change, reaches nobody who has it
  # installed. This fails until the version is raised, so such changes cannot
  # sit unreleased without anyone noticing.
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check that shipped changes have a new version
        run: |
          # What an installed copy runs. Tests, the README and CI are not in it,
          # and the journal pane's tests sit under mods/ but are never loaded.
          shipped='bin adapters lib templates mods .claude-plugin .codex-plugin'

          since=$(git log -1 --format=%H -G'"version"' -- .claude-plugin/plugin.json)
          [ -n "$since" ] || { echo 'found no version change in .claude-plugin/plugin.json'; exit 1; }

          # shellcheck disable=SC2086
          changed=$(git diff --name-only "$since" HEAD -- $shipped ':(exclude)mods/*/tests')
          if [ -n "$changed" ]; then
            echo "These shipped files changed after the version was last raised in $(git log -1 --format='%h (%s)' "$since"):"
            echo "$changed"
            echo 'Raise the version in .claude-plugin/plugin.json, .codex-plugin/plugin.json and package.json.'
            exit 1
          fi
